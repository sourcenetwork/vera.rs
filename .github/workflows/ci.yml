name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# ── Self-hosted Mac Studio runners ──────────────────────────────────
#
# Two runners (studio-1, studio-2): M3 Ultra, 32-core, 512GB RAM.
# Shared with defradb.rs and backbone — don't assume exclusive access.
# Persistent machines: kill lingering processes, reset working tree
# after every run.
#
# No [profile.test] override, no .cargo/config.toml — clippy and test
# share the same dev profile so the warm cache serves both without
# profile thrashing.

jobs:
  lint:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: Lint
    runs-on: [self-hosted, macOS, ARM64, studio]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          clean: false
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@62ae3a85dbdd2bedbb5819da8ce45635129289a1 # 1.98.0
        with:
          components: clippy, rustfmt

      - name: Clear stale checkout credentials
        run: git config --local --unset-all http.https://github.com/.extraheader 2>/dev/null || true

      - name: Remove stale files from other branches
        run: git clean -fdx -e /target

      - name: Fetch locked dependencies
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: url.https://${{ secrets.PRIVATE_REPO_PAT }}@github.com/sourcenetwork/.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/sourcenetwork/
        run: cargo fetch --locked

      - name: CI cleanup checks
        run: PYTHONDONTWRITEBYTECODE=1 python3 .github/scripts/test_stop_test_nodes.py

      - name: Format
        run: cargo fmt -- --check

      - name: Clippy
        run: cargo clippy --frozen --all -- -D warnings

  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: Build & Test
    runs-on: [self-hosted, macOS, ARM64, studio]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          clean: false
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@62ae3a85dbdd2bedbb5819da8ce45635129289a1 # 1.98.0
        with:
          components: clippy, rustfmt

      - name: Clear stale checkout credentials
        run: git config --local --unset-all http.https://github.com/.extraheader 2>/dev/null || true

      - name: Remove stale files from other branches
        run: git clean -fdx -e /target

      - name: Fetch locked dependencies
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: url.https://${{ secrets.PRIVATE_REPO_PAT }}@github.com/sourcenetwork/.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/sourcenetwork/
        run: cargo fetch --locked

      - name: Unit tests
        run: cargo test --frozen --workspace --exclude vera-e2e

      - name: Build verad
        run: cargo build --frozen -p verad

      - name: Cache verad binary for backbone CI
        run: |
          HASH=$(git rev-parse HEAD)
          CACHE_DIR="$HOME/.sourcenetwork/bin/vera.rs/$HASH"
          mkdir -p "$CACHE_DIR"
          cp target/debug/verad "$CACHE_DIR/verad" || cp target/release/verad "$CACHE_DIR/verad" || true
          [ -f "$CACHE_DIR/verad" ] && ln -sf "$CACHE_DIR/verad" "$HOME/.sourcenetwork/bin/verad"

      - name: Cleanup
        if: always()
        run: |
          git checkout -- .
          git clean -fd

  e2e-canonical:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: "E2E (canonical)"
    runs-on: [self-hosted, macOS, ARM64, studio]
    needs: [build]
    timeout-minutes: 20
    env:
      VERA_E2E_DEADLINE_SCALE: "4"
      VERAD_BINARY: ${{ github.workspace }}/target/debug/verad
      TMPDIR: $RUNNER_TEMP/vera-e2e-${{ github.run_id }}-${{ github.run_attempt }}-canonical
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          clean: false
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@62ae3a85dbdd2bedbb5819da8ce45635129289a1 # 1.98.0
        with:
          components: clippy, rustfmt

      - name: Clear stale checkout credentials
        run: git config --local --unset-all http.https://github.com/.extraheader 2>/dev/null || true

      - name: Remove stale files from other branches
        run: git clean -fdx -e /target

      - name: Fetch locked dependencies
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: url.https://${{ secrets.PRIVATE_REPO_PAT }}@github.com/sourcenetwork/.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/sourcenetwork/
        run: cargo fetch --locked

      - name: Prepare test workspace
        run: |
          mkdir -p "$TMPDIR"
          python3 .github/scripts/stop-test-nodes.py "$VERAD_BINARY"

      - name: Build verad
        run: cargo build --frozen -p verad

      - name: Run e2e tests
        run: cargo test --frozen -p vera-e2e --test vera_e2e_canonical -- --nocapture
        timeout-minutes: 15

      - name: Cleanup
        if: always()
        run: |
          git checkout -- .
          git clean -fd
          python3 .github/scripts/stop-test-nodes.py "$VERAD_BINARY"
          rm -rf "$TMPDIR"

  e2e-extended:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: "E2E (extended)"
    runs-on: [self-hosted, macOS, ARM64, studio]
    # Serialized with the canonical suite: both start multi-node clusters on
    # a shared self-hosted studio runner.
    needs: [e2e-canonical]
    timeout-minutes: 20
    env:
      VERA_E2E_DEADLINE_SCALE: "4"
      VERAD_BINARY: ${{ github.workspace }}/target/debug/verad
      VERA_E2E_KEEP: "1"
      RUST_LOG: info
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          clean: false
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@62ae3a85dbdd2bedbb5819da8ce45635129289a1 # 1.98.0
        with:
          components: clippy, rustfmt

      - name: Clear stale checkout credentials
        run: git config --local --unset-all http.https://github.com/.extraheader 2>/dev/null || true

      - name: Remove stale files from other branches
        run: git clean -fdx -e /target

      - name: Fetch locked dependencies
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: url.https://${{ secrets.PRIVATE_REPO_PAT }}@github.com/sourcenetwork/.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/sourcenetwork/
        run: cargo fetch --locked

      - name: Prepare test workspace
        run: |
          extended_test_dir="$RUNNER_TEMP/vera-e2e-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-extended"
          mkdir -p "$extended_test_dir"
          {
            echo "TMPDIR=$extended_test_dir"
            echo "VERA_E2E_DIR=$extended_test_dir/clusters"
          } >> "$GITHUB_ENV"
          python3 .github/scripts/stop-test-nodes.py "$VERAD_BINARY"

      - name: Build verad
        run: cargo build --frozen -p verad

      - name: Run e2e tests
        shell: bash
        run: >-
          cargo test --frozen -p vera-e2e
          --test core_chain
          --test contract_deploy
          --test light_client
          --test gossip_headers
          --test validator_bootstrap
          --test validator_epoch_transition
          --test cross_object_acp
          -- --nocapture 2>&1 | tee "$TMPDIR/test-output.log"
        timeout-minutes: 15

      - name: Upload failed extended test logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: extended-e2e-logs-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/vera-e2e-${{ github.run_id }}-${{ github.run_attempt }}-extended/test-output.log
            ${{ runner.temp }}/vera-e2e-${{ github.run_id }}-${{ github.run_attempt }}-extended/clusters/**/logs/*.log
          if-no-files-found: ignore

      - name: Cleanup
        if: always()
        run: |
          git checkout -- .
          git clean -fd
          python3 .github/scripts/stop-test-nodes.py "$VERAD_BINARY"
          rm -rf "$RUNNER_TEMP/vera-e2e-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-extended"

  artifacts:
    name: Release Artifacts
    runs-on: [self-hosted, macOS, ARM64, studio]
    needs: [lint, build, e2e-canonical, e2e-extended, linux-checks, linux-recovery]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          clean: false
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@62ae3a85dbdd2bedbb5819da8ce45635129289a1 # 1.98.0
        with:
          components: clippy, rustfmt

      - name: Clear stale checkout credentials
        run: git config --local --unset-all http.https://github.com/.extraheader 2>/dev/null || true

      - name: Remove stale files from other branches
        run: git clean -fdx -e /target

      - name: Fetch locked dependencies
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: url.https://${{ secrets.PRIVATE_REPO_PAT }}@github.com/sourcenetwork/.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/sourcenetwork/
        run: cargo fetch --locked

      - name: Build release verad
        run: cargo build --frozen --release -p verad

      - name: Upload verad
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verad-aarch64-apple-darwin
          path: target/release/verad
          retention-days: 30

      - name: Cleanup
        if: always()
        run: |
          git checkout -- .
          git clean -fd

  linux-checks:
    name: Linux checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      VERAD_BINARY: ${{ github.workspace }}/target/debug/verad
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Clear stale checkout credentials
        run: git config --local --unset-all http.https://github.com/.extraheader 2>/dev/null || true

      - name: Remove stale files from other branches
        run: git clean -fdx -e /target

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev cmake pkg-config libssl-dev protobuf-compiler

      - name: Install pinned toolchain
        run: |
          rustc --version
          cargo --version

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: linux-checks

      - name: Fetch locked dependencies
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: url.https://${{ secrets.PRIVATE_REPO_PAT }}@github.com/sourcenetwork/.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/sourcenetwork/
        run: cargo fetch --locked

      - name: Unit and storage tests
        run: |
          cargo test --frozen -p vera-modules --lib
          cargo test --frozen -p vera-modules --test acp_go_parity --test acp_v1_lifecycle --test acp_v1_pages --test acp_conformance
          cargo test --frozen -p vera-backend --lib
          cargo test --frozen -p vera-backend --test native_state --test native_hydration --test pruned_hint
          cargo test --frozen -p vera-backend --example ordered_prefix_baseline
          cargo test --frozen -p vera-e2e --example operation_baseline rejected_updates_preserve_results_and_stop_dependent_submissions
          cargo test --frozen -p vera-node --lib --features regolith-history "history::"

      - name: Build feature variants
        run: |
          cargo build --frozen -p verad
          cargo build --frozen -p verad --features regolith-history
          cargo build --frozen -p verad --features fault-injection
          cargo build --frozen -p verad --features regolith-history,fault-injection
          cargo build --frozen --release -p verad

      - name: Native ring lifecycle with release daemon
        env:
          VERAD_BINARY: ${{ github.workspace }}/target/release/verad
          VERA_E2E_DEADLINE_SCALE: "8"
          VERA_E2E_DIR: ${{ runner.temp }}/native-rings-release
          VERA_E2E_KEEP: "1"
          RUST_LOG: warn,vera_storage=info,vera_node=debug,vera_node::tx_gossip=trace,vera_diagnostics=debug
        run: >-
          cargo test --release --frozen -p vera-e2e --test native_rings
          -- --test-threads=1 --nocapture

      - name: Upload failed native ring logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-native-rings-release-logs
          path: ${{ runner.temp }}/native-rings-release
          if-no-files-found: ignore

  linux-recovery:
    name: Linux recovery (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: lifecycle
            exact: ""
            binary-features: ""
            test-features: ""
            tests: >-
              --test native_permission
              --test native_signed_operation
              --test native_bulletin
              --test native_registration
              --test native_object_archive
              --test native_membership
              --test quorum_recovery
              --test cold_replay
          - suite: snapshot-catchup
            exact: ""
            binary-features: ""
            test-features: ""
            tests: --test snapshot_catchup
          - suite: regolith-recovery
            binary-features: "--features regolith-history"
            test-features: ""
            tests: --test snapshot_catchup snapshot_replica_recovers_from_pruned_peers
            exact: --exact
          - suite: regolith-interrupted
            binary-features: "--features regolith-history,fault-injection"
            test-features: "--features fault-injection"
            tests: --test snapshot_interrupt interrupted_snapshot_resumes_from_pruned_peers
            exact: --exact
          - suite: commit-crash
            exact: ""
            binary-features: "--features fault-injection"
            test-features: "--features fault-injection"
            tests: --test module_commit_crash
          - suite: snapshot-interrupted
            exact: ""
            binary-features: "--features fault-injection"
            test-features: "--features fault-injection"
            tests: --test snapshot_interrupt
    env:
      VERAD_BINARY: ${{ github.workspace }}/target/debug/verad
      VERA_E2E_DEADLINE_SCALE: "8"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Clear stale checkout credentials
        run: git config --local --unset-all http.https://github.com/.extraheader 2>/dev/null || true

      - name: Remove stale files from other branches
        run: git clean -fdx -e /target

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev cmake pkg-config libssl-dev protobuf-compiler

      - name: Install pinned toolchain
        run: |
          rustc --version
          cargo --version

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: linux-recovery

      - name: Fetch locked dependencies
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: url.https://${{ secrets.PRIVATE_REPO_PAT }}@github.com/sourcenetwork/.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/sourcenetwork/

        run: cargo fetch --locked

      - name: Build test binary
        run: cargo build --frozen -p verad ${{ matrix.binary-features }}

      - name: Run suite
        env:
          RUST_LOG: ${{ matrix.suite == 'lifecycle' && 'warn,vera_storage=info,vera_node=debug,vera_node::tx_gossip=trace,vera_diagnostics=debug' || 'warn,vera_storage=info' }}
          VERA_E2E_DIR: ${{ runner.temp }}/e2e-logs
          VERA_E2E_KEEP: "1"
        run: >-
          cargo test --frozen -p vera-e2e ${{ matrix.test-features }}
          ${{ matrix.tests }}
          -- --test-threads=1 --nocapture ${{ matrix.exact }}

      - name: Upload failed cluster logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-${{ matrix.suite }}-cluster-logs
          path: ${{ runner.temp }}/e2e-logs
          if-no-files-found: ignore
