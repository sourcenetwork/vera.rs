name: Native admission pressure

on:
  workflow_dispatch:
    inputs:
      case:
        description: Focused validator availability case
        type: choice
        options: [all, admission, multiworker, stalled-validator, delayed-validator]
        default: all
  pull_request:
    paths:
      - .github/workflows/native-pressure.yml
      - crates/vera-e2e/tests/native_pressure.rs
      - crates/vera-e2e/tests/native_pressure/**
      - crates/vera-e2e/examples/operation_baseline/resources.rs
      - crates/vera-e2e/examples/operation_baseline/process_io.rs
      - .github/scripts/run-native-pressure.py
      - .github/scripts/qualify-native-pressure.py
      - .github/scripts/test_qualify_native_pressure.py
      - tools/performance/resource_usage.py
      - tools/performance/process_io.py
      - tools/performance/record.py
      - crates/vera-consensus/src/components/mempool.rs
      - crates/vera-node/src/tx_gossip.rs
      - crates/vera-executor/src/mempool.rs
      - Cargo.lock
      - crates/vera-node/Cargo.toml

permissions:
  contents: read

concurrency:
  group: native-pressure-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pressure:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_TERM_COLOR: always
      PROTOC: /usr/bin/protoc
      VERAD_BINARY: ${{ github.workspace }}/target/release/verad
      PRESSURE_CASE: ${{ inputs.case || 'all' }}
      VERA_TRACE_SPANS: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@62ae3a85dbdd2bedbb5819da8ce45635129289a1 # 1.98.0
        with:
          components: clippy
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev cmake pkg-config libssl-dev protobuf-compiler iproute2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: linux-recovery
      - name: Fetch locked dependencies
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: url.https://${{ secrets.PRIVATE_REPO_PAT }}@github.com/sourcenetwork/.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/sourcenetwork/
        run: cargo fetch --locked
      - name: Build normal release daemon
        run: cargo build --release --frozen -p verad
      - name: Lint pressure fixture
        run: cargo clippy --frozen -p vera-e2e --test native_pressure -- -D warnings
      - name: Build pressure fixture
        run: >-
          cargo test --release --frozen -p vera-e2e --test native_pressure
          --no-run --message-format=json > "$RUNNER_TEMP/pressure-build.jsonl"
      - name: Check pressure evidence validation
        run: >-
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover
          -s .github/scripts -p test_qualify_native_pressure.py
      - name: Check P2P fault selection and coverage
        run: >-
          cargo test --release --frozen -p vera-e2e --test native_pressure
          netem:: -- --test-threads=1
      - name: Run selected validator availability cases
        id: availability
        timeout-minutes: 15
        env:
          VERA_E2E_DIR: ${{ runner.temp }}/e2e-logs
          VERA_E2E_KEEP: '1'
          RUST_LOG: warn,vera_storage=info
          VERA_E2E_NETEM: '1'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$PRESSURE_CASE" == all || "$PRESSURE_CASE" == admission ]]; then
            python3 .github/scripts/run-native-pressure.py \
              --build-metadata "$RUNNER_TEMP/pressure-build.jsonl" \
              --directory "$RUNNER_TEMP/pressure-measurement" \
              --logs "$VERA_E2E_DIR" \
              --output "$RUNNER_TEMP/pressure-evidence.json"
            if [[ "$PRESSURE_CASE" == admission ]]; then exit 0; fi
          fi
          if [[ "$PRESSURE_CASE" == all || "$PRESSURE_CASE" == multiworker ]]; then
            python3 .github/scripts/run-native-pressure.py \
              --case pipelined_multiworker_admission_preserves_each_sequence_when_quorum_recovers \
              --build-metadata "$RUNNER_TEMP/pressure-build.jsonl" \
              --directory "$RUNNER_TEMP/multiworker-pressure-measurement" \
              --logs "$VERA_E2E_DIR/multiworker" \
              --output "$RUNNER_TEMP/multiworker-pressure-evidence.json"
            if [[ "$PRESSURE_CASE" == multiworker ]]; then exit 0; fi
          fi
          case "$PRESSURE_CASE" in
            all) selector=(--include-ignored --skip pipelined_admission_preserves_work_when_quorum_recovers --skip pipelined_multiworker_admission_preserves_each_sequence_when_quorum_recovers) ;;
            stalled-validator) selector=(stalled_validator::pipelined_stalled_validator_crosses_epoch_and_rejoins_quorum --exact) ;;
            delayed-validator) selector=(delayed_validator::pipelined_delayed_validator_crosses_epoch_and_preserves_work --exact --ignored) ;;
            *) echo 'invalid validator availability case' >&2; exit 1 ;;
          esac
          python3 .github/scripts/capture-tests.py --logs "$VERA_E2E_DIR" \
            cargo test --release --frozen -p vera-e2e --test native_pressure \
            -- --test-threads=1 "${selector[@]}"
      - name: Retain numeric overload resources
        if: always() && (steps.availability.outcome == 'success' || steps.availability.outcome == 'failure') && (inputs.case == 'admission' || inputs.case == 'multiworker' || inputs.case == 'all' || github.event_name == 'pull_request')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-admission-resources
          path: |
            ${{ runner.temp }}/pressure-evidence.json
            ${{ runner.temp }}/multiworker-pressure-evidence.json
          if-no-files-found: error
      - name: Collect bounded recovery evidence
        if: always()
        run: >-
          python3 .github/scripts/summarize-test-results.py
          --logs "$RUNNER_TEMP/e2e-logs"
          --output "$RUNNER_TEMP/recovery-evidence.json"
      - name: Retain pressure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-pressure-evidence
          path: ${{ runner.temp }}/recovery-evidence.json
          if-no-files-found: error
      - name: Stop fixture nodes
        if: always()
        run: python3 .github/scripts/stop-test-nodes.py "$VERAD_BINARY"
      - name: Remove private recovery files
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/e2e-logs"
