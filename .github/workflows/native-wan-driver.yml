name: WAN driver qualification

on:
  workflow_dispatch:
  push:
    branches: ['iverc/qualify-wan-driver']
    paths:
      - crates/vera-e2e/examples/wan_baseline.rs
      - crates/vera-e2e/examples/wan_baseline/**
      - .github/scripts/test-wan-driver.sh
      - .github/workflows/native-wan-driver.yml

permissions:
  contents: read

concurrency:
  group: native-wan-driver-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-wan-driver:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: '2'
      PROTOC: /usr/bin/protoc
      VERAD_BINARY: ${{ github.workspace }}/target/release/verad
      VERA_E2E_KEEP: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@62ae3a85dbdd2bedbb5819da8ce45635129289a1 # 1.98.0
        with:
          components: clippy
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev cmake pkg-config libssl-dev protobuf-compiler
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: hosted-linux-checks
          cache-on-failure: true
      - name: Fetch locked dependencies
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: url.https://${{ secrets.PRIVATE_REPO_PAT }}@github.com/sourcenetwork/.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/sourcenetwork/
        run: cargo fetch --locked
      - name: Lint the remote workload driver
        run: cargo clippy --frozen -p vera-e2e --example wan_baseline -- -D warnings
      - name: Build the normal validator
        run: cargo build --frozen --release -p verad
      - name: Exercise certified workload against four local validator processes
        run: bash .github/scripts/test-wan-driver.sh
