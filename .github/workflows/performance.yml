name: Performance

on:
  workflow_dispatch:
    inputs:
      sustained_fixed_state:
        description: Offer 90,000 operations over 30 minutes against 128 fixed objects
        type: boolean
        default: false
      storage_attribution:
        description: Run the bounded RocksDB storage diagnostic instead of performance baselines
        type: boolean
        default: false
      storage_attribution_mode:
        description: Diagnostic evidence to collect when storage_attribution is enabled
        type: choice
        options: [full, publication]
        default: full
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: performance-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  workload:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && inputs.sustained_fixed_state && 180 || 60 }}
    strategy:
      fail-fast: false
      matrix:
        history: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.storage_attribution && '["rocksdb"]' || '["rocksdb", "regolith"]') }}
    env:
      CARGO_TERM_COLOR: always
      HISTORY_BACKEND: ${{ matrix.history }}
      VERA_E2E_KEEP: '0'
      STORAGE_ATTRIBUTION: ${{ github.event_name == 'workflow_dispatch' && inputs.storage_attribution }}
      STORAGE_ATTRIBUTION_MODE: ${{ inputs.storage_attribution_mode || 'full' }}
      SUSTAINED_FIXED_STATE: ${{ github.event_name == 'workflow_dispatch' && inputs.sustained_fixed_state }}
    steps:
      - name: Validate measurement selection
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$SUSTAINED_FIXED_STATE" == true && "$STORAGE_ATTRIBUTION" == true ]]; then
            echo 'sustained_fixed_state and storage_attribution are mutually exclusive' >&2
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Install build and reporting dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev cmake pkg-config libssl-dev protobuf-compiler python3-venv
          if [[ "$STORAGE_ATTRIBUTION" == true && "$STORAGE_ATTRIBUTION_MODE" == full ]]; then
            sudo apt-get install -y strace
          fi
          python3 -m venv "$RUNNER_TEMP/performance-python"
          "$RUNNER_TEMP/performance-python/bin/pip" install -r tools/performance/requirements.txt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: performance-${{ matrix.history }}

      - name: Fetch locked dependencies
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: url.https://${{ secrets.PRIVATE_REPO_PAT }}@github.com/sourcenetwork/.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/sourcenetwork/
        run: cargo +1.98.0 fetch --locked

      - name: Build release artifacts before measurement
        shell: bash
        run: |
          set -euo pipefail
          features=()
          if [[ "$HISTORY_BACKEND" == regolith ]]; then features=(--features regolith-history); fi
          cargo +1.98.0 build --frozen --release -p verad "${features[@]}"
          if [[ "$STORAGE_ATTRIBUTION" == true ]]; then
            cargo +1.98.0 build --frozen --release -p vera-e2e --example mixed_policy_workload
          else
            cargo +1.98.0 build --frozen --release -p vera-e2e --example operation_baseline
            cargo +1.98.0 build --frozen --release -p vera-e2e --example component_baseline
          fi
          python3 -m unittest discover -s tools/performance -p 'test_*.py'

      - name: Measure local components
        if: env.STORAGE_ATTRIBUTION != 'true'
        run: |
          mkdir -p performance-results
          target/release/examples/component_baseline > performance-results/components.jsonl

      - name: Measure growing and fixed state
        if: env.STORAGE_ATTRIBUTION != 'true'
        env:
          VERA_E2E_DIR: ${{ runner.temp }}/vera-performance-nodes
        shell: bash
        run: |
          set -euo pipefail
          result=0
          count=3000
          object_counts=(0 128)
          recorder=(python3 tools/performance/record.py)
          if [[ "$SUSTAINED_FIXED_STATE" == true ]]; then
            count=90000
            object_counts=(128)
            recorder+=(--timeout-seconds 7200)
          fi
          for objects in "${object_counts[@]}"; do
            directory="performance-results/objects-$objects"
            "${recorder[@]}" \
              --node target/release/verad --runner target/release/examples/operation_baseline \
              --history "$HISTORY_BACKEND" --output "$directory" \
              "$count" 50 128 1 normal 100 192 0 "$objects" 256 1 || result=1
            "$RUNNER_TEMP/performance-python/bin/python" tools/performance/report.py "$directory" || result=1
            if [[ -f "$directory/report.md" ]]; then sed '/^!\[/d' "$directory/report.md" >> "$GITHUB_STEP_SUMMARY"; fi
          done
          exit "$result"

      - name: Attribute Linux storage waits
        if: env.STORAGE_ATTRIBUTION == 'true'
        shell: bash
        run: |
          set -euo pipefail
          private="$RUNNER_TEMP/vera-storage-attribution"
          result=0
          diagnostic=traced
          summary_options=()
          if [[ "$STORAGE_ATTRIBUTION_MODE" == publication ]]; then
            diagnostic=publication
            summary_options=(--publication-only)
          fi
          for mode in normal "$diagnostic"; do
            mkdir -p "$private/$mode"
            export VERA_E2E_DIR="$private/$mode/clusters" VERA_E2E_KEEP=1
            export VERA_TRACE_SPANS=0
            trace=()
            filter=warn
            if [[ "$mode" == traced ]]; then
              export VERA_TRACE_SPANS=1
              filter=warn,vera_publication_diagnostics=debug,commonware_glue::stateful::db=info,commonware_storage::qmdb=info,commonware_utils::sync=info,commonware_runtime::storage::metered=info
              trace=(--sync-trace "$private/$mode/syscalls.log")
            elif [[ "$mode" == publication ]]; then
              filter=warn,vera_publication_diagnostics=debug
            fi
            python3 tools/performance/record.py "${trace[@]}" \
              --node target/release/verad --runner target/release/examples/mixed_policy_workload \
              --history rocksdb --output "$private/$mode/measurement" --rust-log "$filter" \
              32 4 16 300 || result=1
            output="performance-results/storage-attribution/$mode"
            mkdir -p "$output"
            # Raw node logs, syscall paths, stderr, configuration and keys stay in RUNNER_TEMP.
            for artifact in manifest.json workload.jsonl; do
              if [[ -f "$private/$mode/measurement/$artifact" ]]; then
                cp "$private/$mode/measurement/$artifact" "$output/"
              fi
            done
          done
          python3 tools/performance/storage_attribution.py "${summary_options[@]}" \
            --run-root "$private/$diagnostic" \
            --output performance-results/storage-attribution/summary.json || result=1
          echo 'Storage attribution is diagnostic only. Both runs retain all mixed-policy correctness and restart assertions. The selected diagnostic scope, scalar summaries and workload provenance are in the artifact; raw logs remain private on the runner.' >> "$GITHUB_STEP_SUMMARY"
          exit "$result"

      - name: Render interactive measurements
        if: always() && env.STORAGE_ATTRIBUTION != 'true'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          result=0
          for manifest in performance-results/objects-*/manifest.json; do
            directory="${manifest%/manifest.json}"
            python3 tools/performance/replay.py "$directory" \
              --output "$directory/replay.html" || result=1
          done
          exit "$result"

      - name: Upload measurements and provenance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: performance-${{ matrix.history }}-${{ github.event.workflow_run.head_sha || github.sha }}
          path: |
            performance-results/**/manifest.json
            performance-results/**/workload.jsonl
            performance-results/**/components.jsonl
            performance-results/**/summary.json
            performance-results/**/report.md
            performance-results/**/report.json
            performance-results/**/measurements.svg
            performance-results/**/measurements.png
            performance-results/**/replay.html
          if-no-files-found: warn
          retention-days: 30

      - name: Stop workload processes
        if: always()
        run: python3 .github/scripts/stop-test-nodes.py "$GITHUB_WORKSPACE/target/release/verad"
