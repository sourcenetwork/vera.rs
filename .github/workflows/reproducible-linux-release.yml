name: Verify published SDK against release daemon
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: '0'
      VERA_E2E_DEADLINE_SCALE: '8'
      VERA_E2E_KEEP: '1'
      VERA_E2E_DIR: ${{ github.workspace }}/target/published-sdk-e2e
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8
        with:
          toolchain: 1.99.1
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev cmake pkg-config libssl-dev protobuf-compiler
      - name: Download and verify release daemon
        run: |
          gh run download 42537545929 --name clean-release-1 --dir "$RUNNER_TEMP/reproduced"
          cd "$RUNNER_TEMP/reproduced"
          echo '203f1189bd491f04a1d56806e722ccef0f4cbc631e07c8d7d66055b0cd842998  verad-x86_64-unknown-linux-gnu-regolith.tar.gz' | sha256sum -c -
          tar -xzf verad-x86_64-unknown-linux-gnu-regolith.tar.gz verad
          echo '09b63062a150c0300c892d09421800ce7e416d0ae42eb3fd206f26d105486174  verad' | sha256sum -c -
          echo "VERAD_BINARY=$RUNNER_TEMP/reproduced/verad" >> "$GITHUB_ENV"
      - name: Fetch dependencies
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: url.https://${{ secrets.PRIVATE_REPO_PAT }}@github.com/sourcenetwork/.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/sourcenetwork/
        run: cargo fetch --locked
      - name: Test published client and verifier
        run: >-
          python3 .github/scripts/capture-tests.py --logs "$VERA_E2E_DIR"
          cargo test --locked -p vera-e2e --test native_bulletin
          certified_bulletin_reads_follow_grants_pages_and_restart -- --exact --nocapture
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: published-sdk-logs
          path: ${{ env.VERA_E2E_DIR }}
          if-no-files-found: ignore
