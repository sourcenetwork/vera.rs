name: DKG boundary release qualification
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  upstream:
    name: Upstream DKG boundary regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: commonwarexyz/monorepo
          ref: 92a2f68a0e131c8b69de41e84aec37da6280f212
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8
        with:
          toolchain: 1.99.1
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev cmake pkg-config libssl-dev protobuf-compiler
      - name: Run lagging and state-synced boundary regressions
        run: |
          cargo test --locked -p commonware-glue --lib reshare_e2e_boundary_ -- --nocapture > "$RUNNER_TEMP/upstream-boundary.log" 2>&1 || { tail -100 "$RUNNER_TEMP/upstream-boundary.log"; exit 1; }
          grep -E 'running [1-9][0-9]* tests|test result:' "$RUNNER_TEMP/upstream-boundary.log"
          grep -q 'test result: ok. 4 passed;' "$RUNNER_TEMP/upstream-boundary.log"
      - name: Run dealing-window request regression
        run: |
          cargo test --locked -p commonware-glue --lib pr_5263_regression -- --nocapture > "$RUNNER_TEMP/upstream-window.log" 2>&1 || { tail -100 "$RUNNER_TEMP/upstream-window.log"; exit 1; }
          grep -E 'running [1-9][0-9]* tests|test result:' "$RUNNER_TEMP/upstream-window.log"
          grep -q 'test result: ok. 1 passed;' "$RUNNER_TEMP/upstream-window.log"
  vera:
    name: Vera release snapshot and epoch recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      VERA_E2E_DEADLINE_SCALE: '8'
      VERA_E2E_DIR: ${{ github.workspace }}/target/vera-dkg-logs
      VERA_E2E_KEEP: '1'
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 490d9a5a2bc4ed27a04588ae156993aaa90f9ec5
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8
        with:
          toolchain: 1.99.1
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev cmake pkg-config libssl-dev protobuf-compiler
      - name: Retrieve and verify release daemon
        run: |
          gh run download 42539283349 --name clean-release-1 --dir "$RUNNER_TEMP/daemon"
          cd "$RUNNER_TEMP/daemon"
          echo '203f1189bd491f04a1d56806e722ccef0f4cbc631e07c8d7d66055b0cd842998  verad-x86_64-unknown-linux-gnu-regolith.tar.gz' | sha256sum -c -
          tar -xzf verad-x86_64-unknown-linux-gnu-regolith.tar.gz verad
          echo '09b63062a150c0300c892d09421800ce7e416d0ae42eb3fd206f26d105486174  verad' | sha256sum -c -
          echo "VERAD_BINARY=$RUNNER_TEMP/daemon/verad" >> "$GITHUB_ENV"
      - name: Fetch dependencies
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: url.https://${{ secrets.PRIVATE_REPO_PAT }}@github.com/sourcenetwork/.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/sourcenetwork/
        run: cargo fetch --locked
      - name: Verify snapshot recovery and quorum after resharing
        run: |
          python3 .github/scripts/capture-tests.py --logs "$VERA_E2E_DIR/snapshot" cargo test --locked -p vera-e2e --test snapshot_catchup snapshot_replica_recovers_history_and_rejoins_consensus -- --exact --nocapture
          grep -E 'running [1-9][0-9]* tests|test result:' "$VERA_E2E_DIR/snapshot/test-output.log"
          grep -q 'test result: ok. 1 passed;' "$VERA_E2E_DIR/snapshot/test-output.log"
      - name: Verify pipelined recovery across epochs
        run: |
          python3 .github/scripts/capture-tests.py --logs "$VERA_E2E_DIR/quorum" cargo test --locked -p vera-e2e --test quorum_recovery pipelined_quorum_recovery_crosses_epoch_boundaries -- --exact --nocapture
          grep -E 'running [1-9][0-9]* tests|test result:' "$VERA_E2E_DIR/quorum/test-output.log"
          grep -q 'test result: ok. 1 passed;' "$VERA_E2E_DIR/quorum/test-output.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: vera-dkg-recovery-logs
          path: ${{ env.VERA_E2E_DIR }}
          if-no-files-found: ignore
