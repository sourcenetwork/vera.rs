[workspace]
members = ["bin/verad", "crates/*"]
exclude = ["vendor/jsonrpsee-server"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/sourcenetwork/vera.rs"

[workspace.lints.rust]
missing-debug-implementations = "warn"
missing-docs = "warn"
unreachable-pub = "warn"
unused-must-use = "deny"
rust-2018-idioms = "deny"
unnameable-types = "warn"

[workspace.lints.rustdoc]
all = "warn"

[workspace.lints.clippy]
all = "warn"
missing-const-for-fn = "warn"
use-self = "warn"
option-if-let-else = "warn"
redundant-clone = "warn"

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "packed"
incremental = false

# Arkworks BLS field arithmetic is ~1000x slower at opt-level 0.
# Optimize these in dev/test so BLS verification takes ~1ms, not ~1s.
[profile.dev.package.ark-ff]
opt-level = 3
[profile.dev.package.ark-ec]
opt-level = 3
[profile.dev.package.ark-bls12-381]
opt-level = 3
[profile.dev.package.ark-serialize]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
debug = false
strip = "symbols"

[workspace.dependencies]
# Core crates
vera-backend = { path = "crates/vera-backend" }
vera-modules = { path = "crates/vera-modules" }
vera-cli = { path = "crates/vera-cli" }
vera-config = { path = "crates/vera-config" }
vera-consensus = { path = "crates/vera-consensus" }
vera-crypto = { path = "crates/vera-crypto" }
vera-domain = { path = "crates/vera-domain" }
vera-indexer = { path = "crates/vera-indexer" }
vera-overlay = { path = "crates/vera-overlay" }
vera-qmdb = { path = "crates/vera-qmdb" }
vera-jsonrpc = { path = "crates/vera-jsonrpc" }
vera-traits = { path = "crates/vera-traits" }

vera-app = { path = "crates/vera-app" }
vera-node = { path = "crates/vera-node" }
vera-client = { path = "crates/vera-client" }
vera-permission = { path = "crates/vera-permission" }
vera-executor = { path = "crates/vera-executor" }
vera-genesis = { path = "crates/vera-genesis" }
vera-state = { path = "crates/vera-state" }
vera-harness = { path = "crates/vera-harness" }
test-infra = { path = "crates/test-infra" }

# Commonware (calver 2026.9.0)
commonware-actor = { git = "https://github.com/iverc/commonware-upstream", rev = "b04184d8fda928f7f8677e3f56a3de919dc643cc" }
commonware-p2p = "2026.9.0"
commonware-utils = "2026.9.0"
commonware-codec = "2026.9.0"
commonware-runtime = "2026.9.0"
commonware-consensus = "2026.9.0"
commonware-cryptography = "2026.9.0"
commonware-parallel = "2026.9.0"
commonware-storage = "2026.9.0"
commonware-broadcast = "2026.9.0"
commonware-resolver = "2026.9.0"
commonware-macros = "2026.9.0"
commonware-glue = "2026.9.0"
commonware-stream = "2026.9.0"

# Shared Defra types and policy evaluation
acp = { path = "crates/acp" }
identity = { path = "crates/identity" }
zanzibar = { path = "crates/zanzibar" }

# Alloy
alloy-primitives = "1.7"
alloy-consensus = { version = "2.4", features = ["k256"] }
alloy-eips = "2.4"
alloy-rlp = { version = "0.3.16", features = ["derive"] }
alloy-evm = { version = "0.39.0", default-features = false }
alloy-signer = "2.4"
alloy-signer-local = { version = "2.4", default-features = false }
alloy-sol-types = "1.7"

# Execution
revm = { version = "43.0.0", default-features = false, features = ["optional_balance_check"] }

# Async
tokio = { version = "1.50", features = ["full"] }
futures = "0.3"
async-lock = "3"
async-trait = "0.1"

# Serialization
borsh = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"

# CLI
clap = { version = "4", features = ["derive"] }

# Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
thiserror = "2"
eyre = "0.6"
anyhow = "1"

# Cryptography
k256 = "0.13"
sha3 = "0.10"

# Arkworks BLS (match orbis-rs versions)
ark-bls12-381 = "0.4"
ark-ec = "0.4"
ark-ff = "0.4"
ark-serialize = "0.4"
ark-std = "0.4"
jubjub = { version = "0.11.1", default-features = false }
group = { version = "0.14", default-features = false }

# HTTP / RPC
axum = "0.8"
tower = { version = "0.5", features = ["limit"] }
tower-http = { version = "0.6", features = ["cors"] }
jsonrpsee = { version = "0.24", features = ["server-core", "macros", "ws-client"] }
reqwest = { version = "0.12", features = ["json", "blocking"] }

# Concurrency
parking_lot = "0.12"

# DID / encoding
multibase = "0.9"
unsigned-varint = "0.8"

# Encoding
base64 = "0.22"

# Misc
hex = "0.4"
rand = "0.8"
rand_core = "0.6"
bytes = "1"
regex = "1"
proptest = "1"
sha2 = "0.10"
libc = "0.2"

# Testing
tempfile = "3"
rstest = "0.24"

# Runtime fork on upstream 39d04ee1057ee03046973391d26e7101e4a3ef41.
# See docs/snapshot-recovery.md for the retained changes and upgrade constraints.
[patch.crates-io]
commonware-p2p = { git = "https://github.com/iverc/commonware-upstream", rev = "b04184d8fda928f7f8677e3f56a3de919dc643cc" }
commonware-utils = { git = "https://github.com/iverc/commonware-upstream", rev = "b04184d8fda928f7f8677e3f56a3de919dc643cc" }
commonware-codec = { git = "https://github.com/iverc/commonware-upstream", rev = "b04184d8fda928f7f8677e3f56a3de919dc643cc" }
commonware-runtime = { git = "https://github.com/iverc/commonware-upstream", rev = "b04184d8fda928f7f8677e3f56a3de919dc643cc" }
commonware-consensus = { git = "https://github.com/iverc/commonware-upstream", rev = "b04184d8fda928f7f8677e3f56a3de919dc643cc" }
commonware-cryptography = { git = "https://github.com/iverc/commonware-upstream", rev = "b04184d8fda928f7f8677e3f56a3de919dc643cc" }
commonware-parallel = { git = "https://github.com/iverc/commonware-upstream", rev = "b04184d8fda928f7f8677e3f56a3de919dc643cc" }
commonware-storage = { git = "https://github.com/iverc/commonware-upstream", rev = "b04184d8fda928f7f8677e3f56a3de919dc643cc" }
commonware-broadcast = { git = "https://github.com/iverc/commonware-upstream", rev = "b04184d8fda928f7f8677e3f56a3de919dc643cc" }
commonware-resolver = { git = "https://github.com/iverc/commonware-upstream", rev = "b04184d8fda928f7f8677e3f56a3de919dc643cc" }
commonware-macros = { git = "https://github.com/iverc/commonware-upstream", rev = "b04184d8fda928f7f8677e3f56a3de919dc643cc" }
commonware-glue = { git = "https://github.com/iverc/commonware-upstream", rev = "b04184d8fda928f7f8677e3f56a3de919dc643cc" }
commonware-stream = { git = "https://github.com/iverc/commonware-upstream", rev = "b04184d8fda928f7f8677e3f56a3de919dc643cc" }
