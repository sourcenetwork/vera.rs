[package]
name = "vera-client"
publish = ["crates-io"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Rust client library for vera: native submissions, verified reads and typed queries"
readme = "README.md"

[lints]
workspace = true

[dependencies]
borsh.workspace = true
vera-crypto.workspace = true
commonware-codec.workspace = true
vera-domain.workspace = true
vera-permission.workspace = true
vera-modules.workspace = true

alloy-primitives = { workspace = true, features = ["serde"] }
alloy-sol-types.workspace = true
k256-native = { package = "k256", version = "0.14", features = ["ecdsa"] }

ark-bls12-381.workspace = true
ark-ec.workspace = true
ark-ff.workspace = true
ark-serialize.workspace = true
rand.workspace = true
zeroize = "1.8"
tempfile.workspace = true

base64.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
tokio = { workspace = true, features = ["net"] }
hex.workspace = true
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
vera-domain = { workspace = true, features = ["testing"] }
k256.workspace = true
ed25519-dalek.workspace = true
p256.workspace = true
alloy-signer.workspace = true
alloy-signer-local = { workspace = true, default-features = false }
ark-std.workspace = true
tokio = { workspace = true, features = ["rt", "macros"] }
