[package]
name = "vera-e2e"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "End-to-end test harness for vera"

[features]
fault-injection = []

[[test]]
name = "module_commit_crash"
required-features = ["fault-injection"]

[[test]]
name = "snapshot_interrupt"
required-features = ["fault-injection"]

[dependencies]
vera-genesis.workspace = true
vera-harness.workspace = true
vera-node.workspace = true

[dev-dependencies]
vera-cli.workspace = true
orbis-reporting.workspace = true
blst = "0.3"
tempfile.workspace = true
vera-acp = "=0.1.1"
alloy-primitives.workspace = true
alloy-sol-types.workspace = true
commonware-codec.workspace = true
commonware-consensus.workspace = true
commonware-cryptography.workspace = true
commonware-parallel.workspace = true
commonware-utils.workspace = true
futures.workspace = true
hex.workspace = true
vera-client = "=0.1.1"
vera-verifier = "=0.1.1"
vera-domain = "=0.1.1"
vera-crypto = "=0.1.1"
vera-modules = "=0.1.1"
vera-permission = "=0.1.1"
vera-identity = "=0.1.1"
k256.workspace = true
jsonrpsee.workspace = true
jsonrpsee-server = { path = "../../vendor/jsonrpsee-server" }
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["full", "test-util"] }

[lints]
workspace = true
